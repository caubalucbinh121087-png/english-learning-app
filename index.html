<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#5b67f1"><title>IT English Learning</title><style>
:root{--b:#5865f2;--bg:#f3f6fb;--c:#fff;--t:#172033;--m:#667085;--g:#12b76a;--r:#f04438;--o:#f79009;--l:#e5e9f2}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--t)}button,input{font:inherit}.app{max-width:760px;margin:auto;padding:16px 15px 92px}.hero{color:#fff;background:linear-gradient(135deg,#5064ee,#8b5cf6);border-radius:24px;padding:20px}.tabs{display:flex;gap:8px;overflow:auto;padding:14px 1px}.tab,.btn{border:0;border-radius:13px;padding:10px 13px;font-weight:700}.tab{background:#fff;white-space:nowrap}.tab.active,.btn{background:var(--b);color:#fff}.btn.sec{background:#eef0ff;color:#4653d8}.btn.green{background:var(--g)}.btn.orange{background:var(--o)}.btn.red{background:var(--r)}.page{display:none}.page.active{display:block}.card{background:#fff;border:1px solid var(--l);border-radius:20px;padding:18px;margin-bottom:13px}.wordCard{text-align:center;min-height:340px;display:flex;flex-direction:column;justify-content:center}.word{font-size:36px;font-weight:850}.phon{color:var(--m)}.meaning{font-size:23px;color:var(--b);font-weight:800;margin:14px}.example{line-height:1.55;color:#475467}.interview{margin-top:11px;padding:13px;border-radius:14px;background:#f5f3ff;text-align:left}.audioLine{display:flex;gap:8px;align-items:flex-start;justify-content:center;margin:8px 0}.audioLine .text{flex:1;text-align:left}.speaker{border:0;background:#eef0ff;color:#4653d8;border-radius:12px;min-width:42px;height:42px;font-size:19px}.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}.status,.box{background:var(--bg);padding:11px;border-radius:13px;color:var(--m);margin:10px 0}.question{font-size:20px;font-weight:800}.answer{width:100%;padding:12px;text-align:left;border:1px solid var(--l);background:#fff;border-radius:12px;margin:5px 0}</style></head><body><main class="app"><div class="hero"><h2>🇬🇧 IT English Learning</h2><div>Vocabulary + Shadowing + Interview Practice</div></div><nav class="tabs"><button class="tab active" data-p="vocab">🃏 Từ vựng</button><button class="tab" data-p="shadow">🎧 Shadowing</button><button class="tab" data-p="dict">⌨️ Chính tả</button><button class="tab" data-p="quiz">✍️ Quiz</button><button class="tab" data-p="data">🌐 Data</button></nav>
<section class="page active" id="vocab"><div class="card"><div class="status dataStatus">Đang tải lessons.json...</div><div class="wordCard"><div class="word" id="word"></div><div class="phon" id="phon"></div><div class="row"><button class="btn sec" id="wordSpeak">🔊 Phát âm từ</button></div><div class="meaning" id="meaning"></div><div class="audioLine"><button class="speaker" id="exampleSpeak" title="Nghe câu ví dụ">🔊</button><div class="text example" id="example"></div></div><div class="audioLine interview"><button class="speaker" id="interviewSpeak" title="Nghe câu interview">🔊</button><div class="text" id="interview"></div></div></div><div class="row"><button class="btn red" id="again">❌ Chưa nhớ</button><button class="btn orange" id="review">🔁 Ôn lại</button><button class="btn green" id="know">✅ Đã thuộc</button></div><div class="row"><button class="btn sec" id="prev">← Trước</button><button class="btn" id="next">Tiếp →</button></div></div></section>
<section class="page" id="shadow"><div class="card"><h2>🎧 Shadowing</h2><div class="question" id="shText"></div><div class="row"><button class="btn sec" id="shPlay">🔊 Nghe</button><button class="btn sec" id="shSlow">🐢 Chậm</button><button class="btn" id="shMic">🎤 Nói theo</button></div><div class="box" id="shResult">Kết quả nói sẽ hiện ở đây.</div><div class="score" id="shScore" style="font-weight:800;color:var(--b);margin-top:8px"></div></div></section>
<section class="page" id="dict"><div class="card"><h2>⌨️ Chính tả</h2><div class="row"><button class="btn sec" id="diPlay">🔊 Nghe câu</button></div><input id="diInput" style="width:100%;padding:12px;margin:12px 0;border:1px solid var(--l);border-radius:12px" placeholder="Nhập câu nghe được"><button class="btn green" id="diCheck">✓ Kiểm tra</button><div class="box" id="diResult">Kết quả sẽ hiện ở đây.</div></div></section>
<section class="page" id="quiz"><div class="card"><h2>✍️ Quiz</h2><div class="question" id="q"></div><div id="answers"></div><button class="btn" id="qNext">Câu tiếp theo</button></div></section>
<section class="page" id="data"><div class="card"><h2>🌐 Data</h2><div class="box" id="dataInfo"></div><button class="btn" id="reload">↻ Tải lại</button></div></section></main><script>
const $=x=>document.getElementById(x);let lessons=[],i=0;let progress={};try{progress=JSON.parse(localStorage.getItem('itProgress')||'{}')}catch(e){}function save(){try{localStorage.setItem('itProgress',JSON.stringify(progress))}catch(e){}}function mark(s){if(!lessons.length)return;progress[lessons[i].id]={status:s,last:new Date().toISOString()};save()}function say(t,rate=.86){if(!t)return;if(!('speechSynthesis'in window)){alert('Trình duyệt chưa hỗ trợ Text-to-Speech.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=rate;speechSynthesis.speak(u)}function render(){if(!lessons.length)return;let x=lessons[i];$('word').textContent=x.word||'';$('phon').textContent=x.phonetic||'';$('meaning').textContent=x.meaning||x.translation||'';$('example').textContent=x.sentence?'Example: '+x.sentence:'Chưa có câu ví dụ';$('interview').textContent=x.interview_example?'💼 Interview: '+x.interview_example:'Chưa có câu interview';$('shText').textContent=x.sentence||'';$('diInput').value='';$('diResult').textContent='Kết quả sẽ hiện ở đây.';quiz()}function quiz(){if(!lessons.length)return;let x=lessons[Math.floor(Math.random()*lessons.length)],correct=x.meaning||x.translation,opts=[correct,...lessons.filter(y=>y.id!==x.id&&(y.meaning||y.translation)).sort(()=>Math.random()-.5).slice(0,3).map(y=>y.meaning||y.translation)].sort(()=>Math.random()-.5);$('q').textContent='“'+(x.word||x.sentence)+'” nghĩa là gì?';$('answers').innerHTML='';opts.forEach(o=>{let b=document.createElement('button');b.className='answer';b.textContent=o;b.onclick=()=>{b.style.background=o===correct?'#ecfdf3':'#fff0f0'};$('answers').appendChild(b)})}async function load(){try{let r=await fetch('./lessons.json?v='+Date.now());if(!r.ok)throw Error('HTTP '+r.status);let j=await r.json();lessons=Array.isArray(j)?j:j.lessons;$('dataInfo').textContent='✅ Online: '+lessons.length+' bài học';document.querySelectorAll('.dataStatus').forEach(x=>x.textContent='🌐 Online: '+lessons.length+' bài học');render()}catch(e){$('dataInfo').textContent='❌ Không tải được lessons.json: '+e.message}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.p).classList.add('active')});$('wordSpeak').onclick=()=>say(lessons[i]?.word||lessons[i]?.sentence);$('exampleSpeak').onclick=()=>say(lessons[i]?.sentence);$('interviewSpeak').onclick=()=>say(lessons[i]?.interview_example);$('next').onclick=()=>{i=(i+1)%lessons.length;render()};$('prev').onclick=()=>{i=(i-1+lessons.length)%lessons.length;render()};$('again').onclick=()=>{mark('again');$('next').click()};$('review').onclick=()=>{mark('review');$('next').click()};$('know').onclick=()=>{mark('learned');$('next').click()};$('shPlay').onclick=()=>say(lessons[i]?.sentence);$('shSlow').onclick=()=>say(lessons[i]?.sentence,.6);$('shMic').onclick=()=>{let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('shResult').textContent='Trình duyệt này chưa hỗ trợ nhận dạng giọng nói. Hãy thử Chrome/Edge hoặc chạy app qua HTTPS.';return}let r=new SR();r.lang='en-US';r.interimResults=false;$('shResult').textContent='🎤 Đang nghe...';$('shScore').textContent='';r.onresult=e=>{let said=e.results[0][0].transcript,target=lessons[i]?.sentence||'';$('shResult').innerHTML='<b>Bạn nói:</b> '+said+'<br><b>Câu mẫu:</b> '+target;let a=said.toLowerCase().replace(/[^a-z0-9\s]/g,'').trim().split(/\s+/),b=target.toLowerCase().replace(/[^a-z0-9\s]/g,'').trim().split(/\s+/),m=a.length,n=b.length,d=Array.from({length:m+1},()=>Array(n+1).fill(0));for(let x=0;x<=m;x++)d[x][0]=x;for(let y=0;y<=n;y++)d[0][y]=y;for(let x=1;x<=m;x++)for(let y=1;y<=n;y++)d[x][y]=Math.min(d[x-1][y]+1,d[x][y-1]+1,d[x-1][y-1]+(a[x-1]===b[y-1]?0:1));let score=Math.max(0,Math.round((1-d[m][n]/Math.max(m,n,1))*100));$('shScore').textContent='Độ khớp từ: '+score+'%'};r.onerror=e=>{$('shResult').textContent='Không thể nhận dạng giọng nói: '+e.error};r.start()};$('diPlay').onclick=()=>say(lessons[i]?.sentence);$('diCheck').onclick=()=>{$('diResult').innerHTML='<b>Đáp án:</b> '+(lessons[i]?.sentence||'')};$('qNext').onclick=quiz;$('reload').onclick=load;load();
</script></body></html>
